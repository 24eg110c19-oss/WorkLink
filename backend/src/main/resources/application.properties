spring.application.name=Worklink1

# Datasource configuration with environment variable overrides
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/worklink_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto create and update database tables
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

# Server port configured for local dev and cloud containers (Render assigns PORT env)
server.port=${PORT:8080}

# Actuator health endpoint for Render health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always